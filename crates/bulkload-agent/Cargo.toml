[package]
name = "bulkload-agent"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Native resumable file transport, Git estate carry, and provider-state composition"

[[bin]]
name = "bulkload-agent"
path = "src/main.rs"

# R34 dependency wall. This list is closed: the `dep_graph` integration test
# asserts that tokio, opendal, reqwest, ring and tonic are absent from
# `cargo tree -p bulkload-agent -e normal`. Adding an async runtime, an
# object-store abstraction, an HTTP client or a TLS stack to the agent half is
# a design change, not a dependency bump -- take it back to the plan first.
[dependencies]
bulkload-proto = { path = "../bulkload-proto" }
rayon = { workspace = true }
blake3 = { workspace = true }
fastcdc = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
libc = { workspace = true }
rusqlite = { workspace = true, features = ["backup"] }
ignore = { workspace = true }
crc32c = { workspace = true }

[features]
# R-N88: record every mutating `io` syscall (write, sync, rename, link,
# unlink, mkdir, fchmod) into a trace for the crash-state checker. Off by
# default; with it off the recording sites compile to nothing.
io-trace = []

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }

[lints.clippy]
# R33 deny-panics wall. Refusals are Results, never panics.
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
