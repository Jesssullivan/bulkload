\* NEGATIVE: prove refuses any print change (WP0(d)-strict identity), so a
\* `touch` or an identical save refuses GIT_DESTINATION_MODIFIED;
\* Q144 rules content, not stat.
\* Mutation proof_stat_strict must violate TypedRefusal.
\* Rendered from catalogue/EstateConverge.dhall; expected outcome in configs_ec.tsv.
SPECIFICATION Spec
CONSTANTS
    Items         = {"main"}
    Refs          = {"main"}
    Paths         = {"d"}
    IndexOn       = FALSE
    SrcKinds      = {"seat"}
    OpKinds       = {"touch"}
    MaxSrc        = 1
    MaxOp         = 1
    MaxCrashes    = 0
    OpConcurrent  = FALSE
    RacyEdits     = FALSE
    ChildCrash    = FALSE
    Landed        = TRUE
    Mutation      = "proof_stat_strict"
    BudgetSeconds = 1800
INVARIANT TypeOK
INVARIANT TypedRefusal
INVARIANT WithinBudget
