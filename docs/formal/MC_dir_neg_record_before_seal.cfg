\* NEGATIVE: a directory's record is committed before its temporary's entry is sealed: a power loss keeps the record and loses the inode it names.
\* Mutation record_before_seal must violate RecordNamesDirectory.
\* Rendered from catalogue/Directories.dhall; expected outcome in configs_dir.tsv.
SPECIFICATION Spec
CONSTANTS
    Inos            = {i1, i2, i3}
    Deep            = FALSE
    BatchCreate     = FALSE
    BatchFinish     = FALSE
    NoReplaceRename = TRUE
    MaxRuns         = 2
    MaxCrashes      = 1
    MaxForeign      = 0
    Mutation        = "record_before_seal"
    BudgetSeconds   = 600
SYMMETRY InoSymmetry
INVARIANT TypeOK
INVARIANT RecordNamesDirectory
INVARIANT WithinBudget
