\* NEGATIVE: Held{true} is answered before the output's group commit.
\* Mutation held_before_commit must violate HeldAfterCommit.
\* Expected outcome: docs/formal/configs.tsv; results: README.md.
SPECIFICATION Spec
CONSTANTS
    Seats               = {a}
    MaxRuns             = 1
    MaxCrashes          = 0
    MaxEdits            = 0
    MaxForeign          = 0
    MaxCommitFails      = 0
    SpaceRefusals       = FALSE
    RelaxedSourceLedger = FALSE
    RelaxedAuthority    = FALSE
    SupersedeMode       = "off"
    EstateReads         = FALSE
    MaxBackupSteps      = 2
    Mutation            = "held_before_commit"
    BudgetSeconds       = 300
INVARIANT HeldAfterCommit
INVARIANT WithinBudget
