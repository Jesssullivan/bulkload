\* #169 (OI-1003-Q40): R25 under the strict reading of "held durably"
\* (OI-1002-Q33). A crash after the file seal and the rename but before
\* commit_outputs leaves bulkload's own bytes durable at the final path
\* with no row. Each non-racy staged file now carries its capture record,
\* and the resume adopts such an output from it (RecvEntry, Reuse) without
\* a source read: R25_StrictNoDurableReread holds with every safety
\* invariant. MC_r25_unrowed_no_adopt is the same bound without it.
\* Rendered from catalogue/Catalogue.dhall; expected outcome in configs.tsv.
SPECIFICATION Spec
CONSTANTS
    Seats               = {a}
    MaxRuns             = 2
    MaxCrashes          = 1
    MaxEdits            = 0
    MaxForeign          = 0
    MaxCommitFails      = 0
    SpaceRefusals       = FALSE
    RelaxedSourceLedger = FALSE
    RelaxedAuthority    = FALSE
    SupersedeMode       = "off"
    EstateReads         = FALSE
    MaxBackupSteps      = 2
    Mutation            = "none"
    BudgetSeconds       = 300
    StoreRootSealed     = TRUE
    TrackStrictHeld     = TRUE
    AdoptUnrowed        = TRUE
INVARIANT TypeOK
INVARIANT R25_NoDurableReread
INVARIANT R25_NoCommittedCaptureReread
INVARIANT ReadOnce
INVARIANT S3_ReadsOnlyChanged
INVARIANT S3_UnchangedReadsZero
INVARIANT S3_ClosedPassIsHeld
INVARIANT RecordImpliesBytes
INVARIANT HeldAfterCommit
INVARIANT LedgerAfterHeld
INVARIANT DoneAfterLedger
INVARIANT ReuseSound
INVARIANT LedgerSound
INVARIANT NoClobber
INVARIANT S2_TypedSourceAccess
INVARIANT S2_BackupLockBounded
INVARIANT ClosureAccounted
INVARIANT R25_StrictNoDurableReread
INVARIANT WithinBudget
