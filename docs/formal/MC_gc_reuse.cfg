\* Lane L7's manifest step (the code since L7) on MC_gc_fix2's bound:
\* every pass publishes its bundle's {bundle}.reuse manifest after the
\* dependency sidecars and before the record, with crashes between any
\* two steps, and GC removes a collected bundle's manifest with it. A
\* record never lacks its manifest (ReuseManifestBeforeRecord), and
\* every other invariant holds as in MC_gc_fix2: nothing reads it.
\* Rendered from catalogue/GitCarry.dhall; expected outcome in configs_gc.tsv.
SPECIFICATION Spec
CONSTANTS
    Items            = {i1, i2}
    DepthLimit       = 1
    RootWindow       = 3
    ChainUnderBase   = TRUE
    GCOn             = TRUE
    MaxCommits       = 2
    MaxRewrites      = 0
    MaxCrashes       = 1
    MaxDamage        = 1
    DamageBase       = TRUE
    DamageRewrites   = TRUE
    BaseMissingTyped = TRUE
    ReuseManifest    = TRUE
    Mutation         = "none"
    BudgetSeconds    = 600
INVARIANT TypeOK
INVARIANT ChainDepthBounded
INVARIANT PrereqsSatisfiedByEarlierLinks
INVARIANT BrokenLinkNeverReuseHit
INVARIANT BaseNotReplacedWhileDepended
INVARIANT GCNeverDeletesDepended
INVARIANT SidecarsBeforeRecord
INVARIANT ReuseManifestBeforeRecord
INVARIANT RestoreOrRecapture
INVARIANT WithinBudget
