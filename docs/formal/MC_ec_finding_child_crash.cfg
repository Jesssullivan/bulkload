    Items         = {"main"}
    Refs          = {"main", "foo"}
    Paths         = {}
    IndexOn       = FALSE
    SrcKinds      = {"move"}
    OpKinds       = {}
    MaxSrc        = 1
    MaxOp         = 0
    MaxCrashes    = 1
    OpConcurrent  = FALSE
    RacyEdits     = FALSE
    ChildCrash    = TRUE
    Landed        = TRUE
    Mutation      = "none"
    BudgetSeconds = 1800
