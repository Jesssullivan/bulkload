\* #226: liveness of an adoption and the converge after it, with the
\* stated exceptions AdoptBehind (no older-capture baseline) and
\* AdoptKept (a ref R3 or R10 left at adoption stays the
\* destination's: the ghost of what its ref step left, review of
\* 2026-10-16).
\* Rendered from catalogue/EstateConverge.dhall; expected outcome in configs_ec.tsv.
SPECIFICATION LiveSpec
CONSTANTS
    Items         = {"main"}
    Refs          = {"main", "foo"}
    Paths         = {"d"}
    IndexOn       = FALSE
    SrcKinds      = {"move", "seat"}
    OpKinds       = {}
    MaxSrc        = 1
    MaxOp         = 0
    MaxCrashes    = 1
    OpConcurrent  = FALSE
    RacyEdits     = FALSE
    ChildCrash    = FALSE
    Landed        = FALSE
    Adopt         = TRUE
    Mutation      = "none"
    BudgetSeconds = 1800
INVARIANT TypeOK
INVARIANT NoLocalWorkLost
INVARIANT NoSourceWorkLost
INVARIANT TypedRefusal
INVARIANT NoReRead
INVARIANT CrashAtomicity
INVARIANT OneCheckout
INVARIANT NoDriftedLanding
INVARIANT AdoptClaimsOnlyEqual
INVARIANT ForeignRefsUnowned
INVARIANT WithinBudget
PROPERTY ConvergesWhenQuiet
PROPERTY NoWedge
