\* #226: operator edits of a seat, the HEAD branch and the index while
\* the adoption is in flight, and a crash: the proof is rechecked under
\* the lock, the ledger records the proof's prints, so an edit after
\* them refuses MODIFIED at the next converge, and the operator's ref
\* is never owned.
\* Rendered from catalogue/EstateConverge.dhall; expected outcome in configs_ec.tsv.
SPECIFICATION Spec
CONSTANTS
    Items         = {"main"}
    Refs          = {"main"}
    Paths         = {"d"}
    IndexOn       = TRUE
    SrcKinds      = {"seat"}
    OpKinds       = {"seat", "ref", "index"}
    MaxSrc        = 1
    MaxOp         = 1
    MaxCrashes    = 1
    OpConcurrent  = TRUE
    RacyEdits     = FALSE
    ChildCrash    = FALSE
    Landed        = FALSE
    Adopt         = TRUE
    Mutation      = "none"
    BudgetSeconds = 1800
INVARIANT TypeOK
INVARIANT NoLocalWorkLost
INVARIANT NoSourceWorkLost
INVARIANT TypedRefusal
INVARIANT NoReRead
INVARIANT CrashAtomicity
INVARIANT OneCheckout
INVARIANT NoDriftedLanding
INVARIANT AdoptClaimsOnlyEqual
INVARIANT ForeignRefsUnowned
INVARIANT WithinBudget
