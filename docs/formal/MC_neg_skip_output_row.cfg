\* NEGATIVE: the store commit records no output row, so a closed pass holds nothing.
\* Mutation skip_output_row must violate S3_ClosedPassIsHeld.
\* Expected outcome: docs/formal/configs.tsv; results: README.md.
SPECIFICATION Spec
CONSTANTS
    Seats               = {a}
    MaxRuns             = 1
    MaxCrashes          = 0
    MaxEdits            = 0
    MaxForeign          = 0
    MaxCommitFails      = 0
    SpaceRefusals       = FALSE
    RelaxedSourceLedger = FALSE
    RelaxedAuthority    = FALSE
    SupersedeMode       = "off"
    EstateReads         = FALSE
    MaxBackupSteps      = 2
    Mutation            = "skip_output_row"
    BudgetSeconds       = 300
INVARIANT S3_ClosedPassIsHeld
INVARIANT WithinBudget
