\* OI-1003-Q154 lever 3, the code: the directory finish rides the
\* session's last output group. Each final mode is set before that
\* group's renames (Place may follow a Chmod), sealed by its seal
\* (SealDir) and completed in its one commit with every output it
\* owes (GroupFinish); a finish with no group left is Complete, as
\* before. MC_dir_batched's two levels, two runs and one crash; no
\* third party, so no rename is refused (MC_dir_fold_crashes has one).
\* Rendered from catalogue/Directories.dhall; expected outcome in configs_dir.tsv.
SPECIFICATION Spec
CONSTANTS
    Inos            = {i1, i2, i3, i4}
    Deep            = TRUE
    BatchCreate     = TRUE
    BatchFinish     = TRUE
    NoReplaceRename = TRUE
    MaxRuns         = 2
    MaxCrashes      = 1
    MaxForeign      = 0
    FoldFinish      = TRUE
    Mutation        = "none"
    BudgetSeconds   = 3600
SYMMETRY InoSymmetry
INVARIANT TypeOK
INVARIANT RecordNamesDirectory
INVARIANT NoStrandedDirectory
INVARIANT CompleteImpliesFinal
INVARIANT ChildImpliesNamed
INVARIANT NeverAdoptForeign
INVARIANT NoDirectoryUnderTemporary
INVARIANT CompletionAfterChildren
INVARIANT WithinBudget
