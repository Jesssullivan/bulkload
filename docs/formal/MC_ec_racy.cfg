\* A racy write (design 4.2): the operator writes a seat in the
\* timestamp tick of bulkload's write, keeping its stat; the proof
\* reads a racy seat's content, so the edit refuses.
\* Rendered from catalogue/EstateConverge.dhall; expected outcome in configs_ec.tsv.
SPECIFICATION Spec
CONSTANTS
    Items         = {"main"}
    Refs          = {"main"}
    Paths         = {"d"}
    IndexOn       = FALSE
    SrcKinds      = {"seat"}
    OpKinds       = {"racy"}
    MaxSrc        = 2
    MaxOp         = 1
    MaxCrashes    = 0
    OpConcurrent  = FALSE
    RacyEdits     = TRUE
    ChildCrash    = FALSE
    Landed        = TRUE
    Adopt         = FALSE
    Handoff       = FALSE
    Mutation      = "none"
    BudgetSeconds = 1800
INVARIANT TypeOK
INVARIANT NoLocalWorkLost
INVARIANT NoSourceWorkLost
INVARIANT TypedRefusal
INVARIANT NoReRead
INVARIANT CrashAtomicity
INVARIANT OneCheckout
INVARIANT NoDriftedLanding
INVARIANT AdoptClaimsOnlyEqual
INVARIANT ForeignRefsUnowned
INVARIANT HandoffOwnsOnlyItsBlock
INVARIANT WithinBudget
