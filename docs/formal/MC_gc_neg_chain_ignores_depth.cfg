\* NEGATIVE: chainable ignores CHAIN_DEPTH_LIMIT, so a chain outgrows the limit.
\* Mutation chain_ignores_depth must violate ChainDepthBounded.
\* Rendered from catalogue/GitCarry.dhall; expected outcome in configs_gc.tsv.
SPECIFICATION Spec
CONSTANTS
    Items            = {i1}
    DepthLimit       = 1
    RootWindow       = 0
    ChainUnderBase   = FALSE
    GCOn             = FALSE
    MaxCommits       = 2
    MaxRewrites      = 0
    MaxCrashes       = 0
    MaxDamage        = 0
    DamageBase       = FALSE
    DamageRewrites   = TRUE
    BaseMissingTyped = FALSE
    Mutation         = "chain_ignores_depth"
    BudgetSeconds    = 300
INVARIANT TypeOK
INVARIANT ChainDepthBounded
INVARIANT WithinBudget
