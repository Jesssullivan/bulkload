\* NEGATIVE: #169: an unrowed output is adopted without hashing its bytes against
\* its capture record, so a third party's in-place rewrite of a failed
\* group's output is recorded as the capture.
\* Mutation adopt_unverified must violate RecordImpliesBytes.
\* Rendered from catalogue/Catalogue.dhall; expected outcome in configs.tsv.
SPECIFICATION Spec
CONSTANTS
    Seats               = {a}
    MaxRuns             = 2
    MaxCrashes          = 0
    MaxEdits            = 0
    MaxForeign          = 1
    MaxCommitFails      = 1
    SpaceRefusals       = FALSE
    RelaxedSourceLedger = FALSE
    RelaxedAuthority    = FALSE
    SupersedeMode       = "off"
    EstateReads         = FALSE
    MaxBackupSteps      = 2
    Mutation            = "adopt_unverified"
    BudgetSeconds       = 300
    StoreRootSealed     = TRUE
    TrackStrictHeld     = FALSE
    AdoptUnrowed        = TRUE
INVARIANT TypeOK
INVARIANT RecordImpliesBytes
INVARIANT WithinBudget
