\* WP0(d) superseding publish, exchange design (the code since #187):
\* an intent that takes the path's rows, RENAME_EXCHANGE, then the
\* displaced identity is checked against the intent and a foreign file
\* is swapped back; the next session's sweep settles an intent a crash
\* left (rows back, an ownership row, or a displaced foreign file
\* restored). With the ownership row of a racy publish and the
\* remembered refusal (OI-1003-Q101, Q102). One seat, three runs, one
\* crash, one edit, one third-party write.
\* Rendered from catalogue/Catalogue.dhall; expected outcome in configs.tsv.
SPECIFICATION Spec
CONSTANTS
    Seats               = {a}
    MaxRuns             = 3
    MaxCrashes          = 1
    MaxEdits            = 1
    MaxForeign          = 1
    MaxCommitFails      = 0
    SpaceRefusals       = FALSE
    RelaxedSourceLedger = FALSE
    RelaxedAuthority    = FALSE
    SupersedeMode       = "exchange"
    EstateReads         = FALSE
    MaxBackupSteps      = 2
    Mutation            = "none"
    BudgetSeconds       = 600
    StoreRootSealed     = TRUE
    TrackStrictHeld     = FALSE
    AdoptUnrowed        = TRUE
    ExchangeSupported   = TRUE
INVARIANT TypeOK
INVARIANT R25_NoDurableReread
INVARIANT R25_NoCommittedCaptureReread
INVARIANT ReadOnce
INVARIANT S3_ReadsOnlyChanged
INVARIANT S3_UnchangedReadsZero
INVARIANT S3_ClosedPassIsHeld
INVARIANT RecordImpliesBytes
INVARIANT HeldAfterCommit
INVARIANT LedgerAfterHeld
INVARIANT DoneAfterLedger
INVARIANT ReuseSound
INVARIANT LedgerSound
INVARIANT NoClobber
INVARIANT S2_TypedSourceAccess
INVARIANT S2_BackupLockBounded
INVARIANT ClosureAccounted
INVARIANT AdoptOnlyUnrowed
INVARIANT SupersedeAtomic
INVARIANT OwnershipNeverReuse
INVARIANT RememberedRefusalSound
INVARIANT ExchangeRefusedUpFront
INVARIANT WithinBudget
