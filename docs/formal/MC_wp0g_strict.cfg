\* WP0(g) with R25's strict reading (#169, OI-1003-Q40): MC_wp0g_deep's
\* bound with TrackStrictHeld. A relaxed ledger that loses rows, to a
\* power loss or to a failed commit, never costs a read of bytes the
\* destination holds durably, with a row or (by the capture record)
\* without one.
\* Rendered from catalogue/Catalogue.dhall; expected outcome in configs.tsv.
SPECIFICATION Spec
CONSTANTS
    Seats               = {a}
    MaxRuns             = 3
    MaxCrashes          = 2
    MaxEdits            = 1
    MaxForeign          = 1
    MaxCommitFails      = 1
    SpaceRefusals       = TRUE
    RelaxedSourceLedger = TRUE
    RelaxedAuthority    = FALSE
    SupersedeMode       = "off"
    EstateReads         = FALSE
    MaxBackupSteps      = 2
    Mutation            = "none"
    BudgetSeconds       = 600
    StoreRootSealed     = TRUE
    TrackStrictHeld     = TRUE
    AdoptUnrowed        = TRUE
    ExchangeSupported   = TRUE
INVARIANT TypeOK
INVARIANT R25_NoDurableReread
INVARIANT R25_NoCommittedCaptureReread
INVARIANT ReadOnce
INVARIANT S3_ReadsOnlyChanged
INVARIANT S3_UnchangedReadsZero
INVARIANT S3_ClosedPassIsHeld
INVARIANT RecordImpliesBytes
INVARIANT HeldAfterCommit
INVARIANT LedgerAfterHeld
INVARIANT DoneAfterLedger
INVARIANT ReuseSound
INVARIANT LedgerSound
INVARIANT NoClobber
INVARIANT S2_TypedSourceAccess
INVARIANT S2_BackupLockBounded
INVARIANT ClosureAccounted
INVARIANT R25_StrictNoDurableReread
INVARIANT AdoptOnlyUnrowed
INVARIANT WithinBudget
