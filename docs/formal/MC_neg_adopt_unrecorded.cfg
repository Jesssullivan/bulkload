\* NEGATIVE: #169: an output adopted against a manifest gets no capture record
\* (only a staged publish writes one). A racy capture's output is
\* adopted in a later, non-racy run and sealed; a crash before its row
\* commits leaves durable bytes with no row and no record, and the next
\* run reads the seat again.
\* Mutation adopt_unrecorded must violate R25_StrictNoDurableReread.
\* Rendered from catalogue/Catalogue.dhall; expected outcome in configs.tsv.
SPECIFICATION Spec
CONSTANTS
    Seats               = {a}
    MaxRuns             = 3
    MaxCrashes          = 1
    MaxEdits            = 0
    MaxForeign          = 0
    MaxCommitFails      = 0
    SpaceRefusals       = FALSE
    RelaxedSourceLedger = FALSE
    RelaxedAuthority    = FALSE
    SupersedeMode       = "off"
    EstateReads         = FALSE
    MaxBackupSteps      = 2
    Mutation            = "adopt_unrecorded"
    BudgetSeconds       = 300
    StoreRootSealed     = TRUE
    TrackStrictHeld     = TRUE
    AdoptUnrowed        = TRUE
INVARIANT TypeOK
INVARIANT R25_StrictNoDurableReread
INVARIANT WithinBudget
