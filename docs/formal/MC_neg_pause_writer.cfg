\* NEGATIVE: a capture signals the source's writer to pause it.
\* Mutation pause_writer must violate S2_TypedSourceAccess.
\* Expected outcome: docs/formal/configs.tsv; results: README.md.
SPECIFICATION Spec
CONSTANTS
    Seats               = {a}
    MaxRuns             = 1
    MaxCrashes          = 0
    MaxEdits            = 0
    MaxForeign          = 0
    MaxCommitFails      = 0
    SpaceRefusals       = FALSE
    RelaxedSourceLedger = FALSE
    RelaxedAuthority    = FALSE
    SupersedeMode       = "off"
    EstateReads         = FALSE
    MaxBackupSteps      = 2
    Mutation            = "pause_writer"
    BudgetSeconds       = 300
INVARIANT S2_TypedSourceAccess
INVARIANT WithinBudget
