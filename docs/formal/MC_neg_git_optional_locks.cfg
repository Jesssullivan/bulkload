\* NEGATIVE: a git read runs without the optional-locks guard.
\* Mutation git_optional_locks must violate S2_TypedSourceAccess.
\* Rendered from catalogue/Catalogue.dhall; expected outcome in configs.tsv.
SPECIFICATION Spec
CONSTANTS
    Seats               = {a}
    MaxRuns             = 1
    MaxCrashes          = 0
    MaxEdits            = 0
    MaxForeign          = 0
    MaxCommitFails      = 0
    SpaceRefusals       = FALSE
    RelaxedSourceLedger = FALSE
    RelaxedAuthority    = FALSE
    SupersedeMode       = "off"
    EstateReads         = TRUE
    MaxBackupSteps      = 2
    Mutation            = "git_optional_locks"
    BudgetSeconds       = 300
    StoreRootSealed     = TRUE
    TrackStrictHeld     = FALSE
    AdoptUnrowed        = TRUE
    ExchangeSupported   = TRUE
INVARIANT TypeOK
INVARIANT S2_TypedSourceAccess
INVARIANT WithinBudget
