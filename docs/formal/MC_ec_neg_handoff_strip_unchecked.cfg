\* NEGATIVE: OI-1003-Q190: --clear-carried removes a carried block from any
\* bytes under the block, not only from the landed value, so an
\* operator's bytes below the block that start with a carried block
\* lose it.
\* Mutation handoff_strip_unchecked must violate NoLocalWorkLost.
\* Rendered from catalogue/EstateConverge.dhall; expected outcome in configs_ec.tsv.
SPECIFICATION Spec
CONSTANTS
    Items         = {"main"}
    Refs          = {"main"}
    Paths         = {"d"}
    IndexOn       = FALSE
    SrcKinds      = {"seat", "carried"}
    OpKinds       = {"block", "seat"}
    MaxSrc        = 1
    MaxOp         = 1
    MaxCrashes    = 1
    OpConcurrent  = TRUE
    RacyEdits     = FALSE
    ChildCrash    = FALSE
    Landed        = TRUE
    Adopt         = FALSE
    Handoff       = TRUE
    Mutation      = "handoff_strip_unchecked"
    BudgetSeconds = 1800
INVARIANT TypeOK
INVARIANT NoLocalWorkLost
INVARIANT WithinBudget
