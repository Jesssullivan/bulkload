\* NEGATIVE: WP0(d) exchange whose recovery sweeps a displaced foreign file like a
\* temporary.
\* Mutation sweep_displaced must violate NoClobber.
\* Rendered by gen_cfgs.py; expected outcome in configs.tsv.
SPECIFICATION Spec
CONSTANTS
    Seats               = {a}
    MaxRuns             = 3
    MaxCrashes          = 1
    MaxEdits            = 1
    MaxForeign          = 1
    MaxCommitFails      = 0
    SpaceRefusals       = FALSE
    RelaxedSourceLedger = FALSE
    RelaxedAuthority    = FALSE
    SupersedeMode       = "exchange"
    EstateReads         = FALSE
    MaxBackupSteps      = 2
    Mutation            = "sweep_displaced"
    BudgetSeconds       = 300
INVARIANT TypeOK
INVARIANT NoClobber
INVARIANT WithinBudget
