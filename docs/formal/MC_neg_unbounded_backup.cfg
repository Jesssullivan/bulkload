\* NEGATIVE: the SQLite backup takes its lock past max_steps.
\* Mutation unbounded_backup must violate S2_BackupLockBounded.
\* Rendered by gen_cfgs.py; expected outcome in configs.tsv.
SPECIFICATION Spec
CONSTANTS
    Seats               = {a}
    MaxRuns             = 1
    MaxCrashes          = 0
    MaxEdits            = 0
    MaxForeign          = 0
    MaxCommitFails      = 0
    SpaceRefusals       = FALSE
    RelaxedSourceLedger = FALSE
    RelaxedAuthority    = FALSE
    SupersedeMode       = "off"
    EstateReads         = TRUE
    MaxBackupSteps      = 2
    Mutation            = "unbounded_backup"
    BudgetSeconds       = 300
    StoreRootSealed     = TRUE
    TrackStrictHeld     = FALSE
INVARIANT TypeOK
INVARIANT S2_BackupLockBounded
INVARIANT WithinBudget
