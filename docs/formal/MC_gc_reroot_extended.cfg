\* OI-1003-Q46's re-rooted chain extended, on one item: depth limit 2
\* and a 5-capture window (RootWindow = DepthLimit + 3), so a capture
\* chains on a re-root bundle and RootOf, GC and restore run through
\* it; every fault. Explorer preset gc_reroot_extended.
\* MC_gc_reach_reroot_extended shows the extension is reached.
\* Rendered from catalogue/GitCarry.dhall; expected outcome in configs_gc.tsv.
SPECIFICATION Spec
CONSTANTS
    Items            = {i1}
    DepthLimit       = 2
    RootWindow       = 5
    ChainUnderBase   = FALSE
    GCOn             = TRUE
    MaxCommits       = 4
    MaxRewrites      = 1
    MaxCrashes       = 1
    MaxDamage        = 1
    DamageBase       = FALSE
    DamageRewrites   = TRUE
    BaseMissingTyped = FALSE
    Mutation         = "none"
    BudgetSeconds    = 600
INVARIANT TypeOK
INVARIANT ChainDepthBounded
INVARIANT PrereqsSatisfiedByEarlierLinks
INVARIANT BrokenLinkNeverReuseHit
INVARIANT BaseNotReplacedWhileDepended
INVARIANT GCNeverDeletesDepended
INVARIANT SidecarsBeforeRecord
INVARIANT RestoreOrRecapture
INVARIANT WithinBudget
