\* SIMULATION ONLY, never a model-checking result: the constants first
\* drafted for MC_main (two seats, three runs, one crash, every fault).
\* Random behaviours of bounded depth from a fixed seed, every
\* invariant. No SYMMETRY (simulation does not use it).
\* Rendered by gen_cfgs.py; expected outcome in configs.tsv.
SPECIFICATION Spec
CONSTANTS
    Seats               = {a, b}
    MaxRuns             = 3
    MaxCrashes          = 1
    MaxEdits            = 1
    MaxForeign          = 1
    MaxCommitFails      = 1
    SpaceRefusals       = TRUE
    RelaxedSourceLedger = FALSE
    RelaxedAuthority    = FALSE
    SupersedeMode       = "off"
    EstateReads         = FALSE
    MaxBackupSteps      = 2
    Mutation            = "none"
    BudgetSeconds       = 600
INVARIANT TypeOK
INVARIANT R25_NoDurableReread
INVARIANT R25_NoCommittedCaptureReread
INVARIANT ReadOnce
INVARIANT S3_ReadsOnlyChanged
INVARIANT S3_UnchangedReadsZero
INVARIANT S3_ClosedPassIsHeld
INVARIANT RecordImpliesBytes
INVARIANT HeldAfterCommit
INVARIANT LedgerAfterHeld
INVARIANT DoneAfterLedger
INVARIANT ReuseSound
INVARIANT LedgerSound
INVARIANT NoClobber
INVARIANT S2_TypedSourceAccess
INVARIANT S2_BackupLockBounded
INVARIANT ClosureAccounted
INVARIANT WithinBudget
