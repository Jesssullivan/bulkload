\* raced snapshot read, the next pass is a reuse hit on a capture no
\* apply lays down, and the landing never converges.
\* Mutation drift_key_reused must violate ConvergesWhenQuiet.
\* Rendered from catalogue/EstateConverge.dhall; expected outcome in configs_ec.tsv.
SPECIFICATION LiveSpec
CONSTANTS
    Items         = {"main"}
    Refs          = {"main", "foo"}
    Paths         = {}
    IndexOn       = FALSE
    SrcKinds      = {"race", "switch"}
    OpKinds       = {}
    MaxSrc        = 2
    MaxOp         = 0
    MaxCrashes    = 0
    OpConcurrent  = FALSE
    RacyEdits     = FALSE
    ChildCrash    = FALSE
    Landed        = TRUE
    Mutation      = "drift_key_reused"
    BudgetSeconds = 1800
INVARIANT TypeOK
INVARIANT WithinBudget
PROPERTY ConvergesWhenQuiet
