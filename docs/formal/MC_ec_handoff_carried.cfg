\* OI-1003-Q190: the source's target starts with a carried block;
\* --clear --clear-carried removes it from the landed value only, as a
\* recorded edit converge accepts (alone or under the block), and the
\* source then edits the target again; a crash at any step: no seat
\* is refused for bulkload's own edit (TypedRefusal), and every
\* component is old or new (CrashAtomicity).
\* Rendered from catalogue/EstateConverge.dhall; expected outcome in configs_ec.tsv.
SPECIFICATION Spec
CONSTANTS
    Items         = {"main"}
    Refs          = {"main"}
    Paths         = {"d"}
    IndexOn       = FALSE
    SrcKinds      = {"seat", "carried"}
    OpKinds       = {}
    MaxSrc        = 2
    MaxOp         = 0
    MaxCrashes    = 1
    OpConcurrent  = FALSE
    RacyEdits     = FALSE
    ChildCrash    = FALSE
    Landed        = TRUE
    Adopt         = FALSE
    Handoff       = TRUE
    Mutation      = "none"
    BudgetSeconds = 1800
INVARIANT TypeOK
INVARIANT NoLocalWorkLost
INVARIANT NoSourceWorkLost
INVARIANT TypedRefusal
INVARIANT NoReRead
INVARIANT CrashAtomicity
INVARIANT OneCheckout
INVARIANT NoDriftedLanding
INVARIANT AdoptClaimsOnlyEqual
INVARIANT ForeignRefsUnowned
INVARIANT HandoffOwnsOnlyItsBlock
INVARIANT WithinBudget
