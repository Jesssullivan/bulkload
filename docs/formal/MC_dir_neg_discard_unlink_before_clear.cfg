\* NEGATIVE: a refused rename's temporary is removed before its record is cleared: a power loss keeps the record bound to a freed inode number, which a third party's directory then takes at the leaf, and the next run adopts it (#74 N3; #217 review, finding 2).
\* Mutation discard_unlink_before_clear must violate NeverAdoptForeign.
\* Rendered from catalogue/Directories.dhall; expected outcome in configs_dir.tsv.
SPECIFICATION Spec
CONSTANTS
    Inos            = {i1, i2, i3}
    Deep            = FALSE
    BatchCreate     = FALSE
    BatchFinish     = FALSE
    NoReplaceRename = TRUE
    MaxRuns         = 2
    MaxCrashes      = 1
    MaxForeign      = 2
    Mutation        = "discard_unlink_before_clear"
    BudgetSeconds   = 600
SYMMETRY InoSymmetry
INVARIANT TypeOK
INVARIANT NeverAdoptForeign
INVARIANT WithinBudget
