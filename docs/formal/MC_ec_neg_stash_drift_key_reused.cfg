\* NEGATIVE: OI-1003-Q161: a capture a stash push raced records the key its
\* pass computed (not the poisoned one), so when the source drops
\* the stash again, the next pass is a reuse hit on a capture no
\* apply lays down, and the landing never converges.
\* Mutation drift_key_reused must violate ConvergesWhenQuiet.
\* Rendered from catalogue/EstateConverge.dhall; expected outcome in configs_ec.tsv.
SPECIFICATION LiveSpec
CONSTANTS
    Items         = {"main"}
    Refs          = {"main"}
    Paths         = {}
    IndexOn       = FALSE
    SrcKinds      = {"stashrace", "stash"}
    OpKinds       = {}
    MaxSrc        = 2
    MaxOp         = 0
    MaxCrashes    = 0
    OpConcurrent  = FALSE
    RacyEdits     = FALSE
    ChildCrash    = FALSE
    Landed        = TRUE
    Mutation      = "drift_key_reused"
    BudgetSeconds = 1800
INVARIANT TypeOK
INVARIANT WithinBudget
PROPERTY ConvergesWhenQuiet
