\* Main config: the code as it is today (strict source ledger, no
\* superseding publish). Two seats, a crash and a rerun, a source edit,
\* a third-party write, a failed group commit and the space refusal,
\* with every safety invariant.
\* Expected outcome: docs/formal/configs.tsv; results: README.md.
SPECIFICATION Spec
CONSTANTS
    Seats               = {a, b}
    MaxRuns             = 2
    MaxCrashes          = 1
    MaxEdits            = 1
    MaxForeign          = 1
    MaxCommitFails      = 1
    SpaceRefusals       = TRUE
    RelaxedSourceLedger = FALSE
    RelaxedAuthority    = FALSE
    SupersedeMode       = "off"
    EstateReads         = FALSE
    MaxBackupSteps      = 2
    Mutation            = "none"
    BudgetSeconds       = 900
SYMMETRY SeatSymmetry
INVARIANT TypeOK
INVARIANT R25_NoDurableReread
INVARIANT R25_NoCommittedCaptureReread
INVARIANT ReadOnce
INVARIANT S3_ReadsOnlyChanged
INVARIANT S3_UnchangedReadsZero
INVARIANT S3_ClosedPassIsHeld
INVARIANT RecordImpliesBytes
INVARIANT HeldAfterCommit
INVARIANT LedgerAfterHeld
INVARIANT DoneAfterLedger
INVARIANT ReuseSound
INVARIANT LedgerSound
INVARIANT NoClobber
INVARIANT S2_TypedSourceAccess
INVARIANT S2_BackupLockBounded
INVARIANT ClosureAccounted
INVARIANT WithinBudget
