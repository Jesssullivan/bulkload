\* #169 across a lost source authority: MC_r25_unrowed_bytes's bound
\* with the source state root's entry unsealed, so a source power loss
\* may lose the store and the next run keys every row anew. The capture
\* record's key holds no authority (the walked row alone), so outputs
\* with a record, rowed or not, are adopted without a read: the strict
\* reading and R25_NoDurableReread both hold. MC_store_root_unsealed is
\* this bound before #169, and fails.
\* Rendered from catalogue/Catalogue.dhall; expected outcome in configs.tsv.
SPECIFICATION Spec
CONSTANTS
    Seats               = {a}
    MaxRuns             = 2
    MaxCrashes          = 1
    MaxEdits            = 0
    MaxForeign          = 0
    MaxCommitFails      = 0
    SpaceRefusals       = FALSE
    RelaxedSourceLedger = FALSE
    RelaxedAuthority    = FALSE
    SupersedeMode       = "off"
    EstateReads         = FALSE
    MaxBackupSteps      = 2
    Mutation            = "none"
    BudgetSeconds       = 300
    StoreRootSealed     = FALSE
    TrackStrictHeld     = TRUE
    AdoptUnrowed        = TRUE
INVARIANT TypeOK
INVARIANT R25_NoDurableReread
INVARIANT R25_NoCommittedCaptureReread
INVARIANT ReadOnce
INVARIANT S3_ReadsOnlyChanged
INVARIANT S3_UnchangedReadsZero
INVARIANT S3_ClosedPassIsHeld
INVARIANT RecordImpliesBytes
INVARIANT HeldAfterCommit
INVARIANT LedgerAfterHeld
INVARIANT DoneAfterLedger
INVARIANT ReuseSound
INVARIANT LedgerSound
INVARIANT NoClobber
INVARIANT S2_TypedSourceAccess
INVARIANT S2_BackupLockBounded
INVARIANT ClosureAccounted
INVARIANT R25_StrictNoDurableReread
INVARIANT AdoptOnlyUnrowed
INVARIANT WithinBudget
