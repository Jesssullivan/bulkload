\* OI-1003-Q190: as MC_ec_handoff_carried, with the operator's edits
\* (below the block, with or without a carried block of their own,
\* inside it, removed by hand) also while an apply is in flight:
\* --clear-carried never removes a carried block from the operator's
\* bytes (NoLocalWorkLost).
\* Rendered from catalogue/EstateConverge.dhall; expected outcome in configs_ec.tsv.
SPECIFICATION Spec
CONSTANTS
    Items         = {"main"}
    Refs          = {"main"}
    Paths         = {"d"}
    IndexOn       = FALSE
    SrcKinds      = {"seat", "carried"}
    OpKinds       = {"block", "seat"}
    MaxSrc        = 1
    MaxOp         = 1
    MaxCrashes    = 1
    OpConcurrent  = TRUE
    RacyEdits     = FALSE
    ChildCrash    = FALSE
    Landed        = TRUE
    Adopt         = FALSE
    Handoff       = TRUE
    Mutation      = "none"
    BudgetSeconds = 1800
INVARIANT TypeOK
INVARIANT NoLocalWorkLost
INVARIANT NoSourceWorkLost
INVARIANT TypedRefusal
INVARIANT NoReRead
INVARIANT CrashAtomicity
INVARIANT OneCheckout
INVARIANT NoDriftedLanding
INVARIANT AdoptClaimsOnlyEqual
INVARIANT ForeignRefsUnowned
INVARIANT HandoffOwnsOnlyItsBlock
INVARIANT WithinBudget
