\* WP0(g) / OI-1003-Q20, breadth: the source ledger's row commits run
\* synchronous=NORMAL, fullfsync=OFF, so a source power loss may drop
\* any subset of them. The store-creation commit (schema and
\* authority) stays durable. Every safety invariant must still hold.
\* Rendered by gen_cfgs.py; expected outcome in configs.tsv.
SPECIFICATION Spec
CONSTANTS
    Seats               = {a, b}
    MaxRuns             = 2
    MaxCrashes          = 1
    MaxEdits            = 1
    MaxForeign          = 0
    MaxCommitFails      = 0
    SpaceRefusals       = FALSE
    RelaxedSourceLedger = TRUE
    RelaxedAuthority    = FALSE
    SupersedeMode       = "off"
    EstateReads         = FALSE
    MaxBackupSteps      = 2
    Mutation            = "none"
    BudgetSeconds       = 600
SYMMETRY SeatSymmetry
INVARIANT TypeOK
INVARIANT R25_NoDurableReread
INVARIANT R25_NoCommittedCaptureReread
INVARIANT ReadOnce
INVARIANT S3_ReadsOnlyChanged
INVARIANT S3_UnchangedReadsZero
INVARIANT S3_ClosedPassIsHeld
INVARIANT RecordImpliesBytes
INVARIANT HeldAfterCommit
INVARIANT LedgerAfterHeld
INVARIANT DoneAfterLedger
INVARIANT ReuseSound
INVARIANT LedgerSound
INVARIANT NoClobber
INVARIANT S2_TypedSourceAccess
INVARIANT S2_BackupLockBounded
INVARIANT ClosureAccounted
INVARIANT WithinBudget
