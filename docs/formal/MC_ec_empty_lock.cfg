\* Review 4: an empty lock (a killed delete's, packed-refs.lock, an
\* operator's live writer's) is never removed by bulkload; the item
\* refuses typed until its owner, or the operator as Git
\* instructs, removes it (NoWedge's stated exception), and an
\* orphan packed-refs.new is removed once no lock holds it.
\* Rendered from catalogue/EstateConverge.dhall; expected outcome in configs_ec.tsv.
SPECIFICATION LiveSpec
CONSTANTS
    Items         = {"main"}
    Refs          = {"main", "o/x"}
    Paths         = {}
    IndexOn       = FALSE
    SrcKinds      = {"delete"}
    OpKinds       = {"lock"}
    MaxSrc        = 1
    MaxOp         = 2
    MaxCrashes    = 1
    OpConcurrent  = FALSE
    RacyEdits     = FALSE
    ChildCrash    = TRUE
    Landed        = TRUE
    Mutation      = "none"
    BudgetSeconds = 1800
INVARIANT TypeOK
INVARIANT NoLocalWorkLost
INVARIANT NoSourceWorkLost
INVARIANT TypedRefusal
INVARIANT NoReRead
INVARIANT CrashAtomicity
INVARIANT OneCheckout
INVARIANT NoDriftedLanding
INVARIANT WithinBudget
PROPERTY ConvergesWhenQuiet
PROPERTY NoWedge
