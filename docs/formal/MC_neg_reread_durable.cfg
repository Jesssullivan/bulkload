\* NEGATIVE: the destination never answers Reuse, so a rerun re-reads held bytes.
\* Mutation reread_durable must violate R25_NoDurableReread.
\* Expected outcome: docs/formal/configs.tsv; results: README.md.
SPECIFICATION Spec
CONSTANTS
    Seats               = {a}
    MaxRuns             = 2
    MaxCrashes          = 1
    MaxEdits            = 0
    MaxForeign          = 0
    MaxCommitFails      = 0
    SpaceRefusals       = FALSE
    RelaxedSourceLedger = FALSE
    RelaxedAuthority    = FALSE
    SupersedeMode       = "off"
    EstateReads         = FALSE
    MaxBackupSteps      = 2
    Mutation            = "reread_durable"
    BudgetSeconds       = 300
INVARIANT R25_NoDurableReread
INVARIANT WithinBudget
