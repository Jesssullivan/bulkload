\* NEGATIVE: #169: Reuse ignores the output's row (Store::output_matches always
\* false), so a rerun adopts every rowed output again from its capture
\* record: hashed, sealed and re-rowed, with 0 source bytes read. No
\* R25 or S3 property can see that; AdoptOnlyUnrowed does.
\* Mutation reuse_ignores_row must violate AdoptOnlyUnrowed.
\* Rendered from catalogue/Catalogue.dhall; expected outcome in configs.tsv.
SPECIFICATION Spec
CONSTANTS
    Seats               = {a}
    MaxRuns             = 2
    MaxCrashes          = 0
    MaxEdits            = 0
    MaxForeign          = 0
    MaxCommitFails      = 0
    SpaceRefusals       = FALSE
    RelaxedSourceLedger = FALSE
    RelaxedAuthority    = FALSE
    SupersedeMode       = "off"
    EstateReads         = FALSE
    MaxBackupSteps      = 2
    Mutation            = "reuse_ignores_row"
    BudgetSeconds       = 300
    StoreRootSealed     = TRUE
    TrackStrictHeld     = FALSE
    AdoptUnrowed        = TRUE
    ExchangeSupported   = TRUE
INVARIANT TypeOK
INVARIANT AdoptOnlyUnrowed
INVARIANT WithinBudget
