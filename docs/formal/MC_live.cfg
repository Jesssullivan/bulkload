\* Liveness under WF_vars(Protocol): no crash, a stable source. Every
\* started run reaches closure (every seat applied or typed-refused),
\* and every run is made. The space refusal stays on (a typed refusal
\* closes an item). No SYMMETRY: it is unsound for liveness.
\* Rendered by gen_cfgs.py; expected outcome in configs.tsv.
SPECIFICATION LiveSpec
CONSTANTS
    Seats               = {a, b}
    MaxRuns             = 2
    MaxCrashes          = 0
    MaxEdits            = 0
    MaxForeign          = 0
    MaxCommitFails      = 0
    SpaceRefusals       = TRUE
    RelaxedSourceLedger = FALSE
    RelaxedAuthority    = FALSE
    SupersedeMode       = "off"
    EstateReads         = FALSE
    MaxBackupSteps      = 2
    Mutation            = "none"
    BudgetSeconds       = 600
INVARIANT TypeOK
INVARIANT ClosureAccounted
INVARIANT WithinBudget
PROPERTY RunsClose
PROPERTY AllRunsFinish
