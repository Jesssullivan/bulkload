\* Liveness: no crash, a stable source, a fair protocol. Every started
\* run reaches closure (every seat applied or typed-refused), and every
\* run is made. No symmetry: it is unsound for liveness.
\* Expected outcome: docs/formal/configs.tsv; results: README.md.
SPECIFICATION LiveSpec
CONSTANTS
    Seats               = {a, b}
    MaxRuns             = 2
    MaxCrashes          = 0
    MaxEdits            = 0
    MaxForeign          = 0
    MaxCommitFails      = 0
    SpaceRefusals       = TRUE
    RelaxedSourceLedger = FALSE
    RelaxedAuthority    = FALSE
    SupersedeMode       = "off"
    EstateReads         = FALSE
    MaxBackupSteps      = 2
    Mutation            = "none"
    BudgetSeconds       = 600
INVARIANT TypeOK
INVARIANT ClosureAccounted
INVARIANT WithinBudget
PROPERTY RunsClose
PROPERTY AllRunsFinish
