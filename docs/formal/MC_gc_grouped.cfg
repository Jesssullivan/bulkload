\* Two items on one plan base, the code today: damage may reach the
\* base, and prepare_base must refuse rather than replace it. Assumes
\* apply refuses a missing base by name (MC_gc_base_missing_untyped).
\* Explorer preset gc_grouped.
\* Rendered from catalogue/GitCarry.dhall; expected outcome in configs_gc.tsv.
SPECIFICATION Spec
CONSTANTS
    Items            = {i1, i2}
    DepthLimit       = 2
    RootWindow       = 0
    ChainUnderBase   = FALSE
    GCOn             = FALSE
    MaxCommits       = 2
    MaxRewrites      = 0
    MaxCrashes       = 1
    MaxDamage        = 1
    DamageBase       = TRUE
    DamageRewrites   = TRUE
    BaseMissingTyped = TRUE
    Mutation         = "none"
    BudgetSeconds    = 600
INVARIANT TypeOK
INVARIANT ChainDepthBounded
INVARIANT PrereqsSatisfiedByEarlierLinks
INVARIANT BrokenLinkNeverReuseHit
INVARIANT BaseNotReplacedWhileDepended
INVARIANT GCNeverDeletesDepended
INVARIANT SidecarsBeforeRecord
INVARIANT RestoreOrRecapture
INVARIANT WithinBudget
