\* Operator edits of a seat and of the index while an apply is in
\* flight (findings 3, 10): the exchange's displaced check and the
\* index compare-and-swap keep them.
\* Rendered from catalogue/EstateConverge.dhall; expected outcome in configs_ec.tsv.
SPECIFICATION Spec
CONSTANTS
    Items         = {"main"}
    Refs          = {"main"}
    Paths         = {"d"}
    IndexOn       = TRUE
    SrcKinds      = {"seat", "index"}
    OpKinds       = {"seat", "index"}
    MaxSrc        = 1
    MaxOp         = 1
    MaxCrashes    = 0
    OpConcurrent  = TRUE
    RacyEdits     = FALSE
    ChildCrash    = FALSE
    Landed        = TRUE
    Mutation      = "none"
    BudgetSeconds = 1800
INVARIANT TypeOK
INVARIANT NoLocalWorkLost
INVARIANT NoSourceWorkLost
INVARIANT TypedRefusal
INVARIANT NoReRead
INVARIANT CrashAtomicity
INVARIANT WithinBudget
