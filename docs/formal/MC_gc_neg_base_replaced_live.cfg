\* NEGATIVE: prepare_base replaces a missing base that older deltas depend on.
\* One commit: a base re-exported at the same tip has the same content
\* name, so only a later tip can replace it.
\* Mutation base_replaced_live must violate BaseNotReplacedWhileDepended.
\* Rendered from catalogue/GitCarry.dhall; expected outcome in configs_gc.tsv.
SPECIFICATION Spec
CONSTANTS
    Items            = {i1, i2}
    DepthLimit       = 2
    RootWindow       = 0
    ChainUnderBase   = FALSE
    GCOn             = FALSE
    MaxCommits       = 1
    MaxRewrites      = 0
    MaxCrashes       = 0
    MaxDamage        = 1
    DamageBase       = TRUE
    DamageRewrites   = TRUE
    BaseMissingTyped = TRUE
    Mutation         = "base_replaced_live"
    BudgetSeconds    = 300
INVARIANT TypeOK
INVARIANT BaseNotReplacedWhileDepended
INVARIANT WithinBudget
