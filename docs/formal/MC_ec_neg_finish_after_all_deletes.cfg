\* NEGATIVE: CODE TODAY (review 3 finding 1): finish removes every delete's
\* name from the names after the step, whether the delete runs or
\* not, so a create beside a kept o/x is retried forever.
\* Mutation finish_after_all_deletes must violate NoWedge.
\* Rendered from catalogue/EstateConverge.dhall; expected outcome in configs_ec.tsv.
SPECIFICATION LiveSpec
CONSTANTS
    Items         = {"main"}
    Refs          = {"main", "o/x", "o/x/y"}
    Paths         = {}
    IndexOn       = FALSE
    SrcKinds      = {"rename"}
    OpKinds       = {"ref"}
    MaxSrc        = 1
    MaxOp         = 1
    MaxCrashes    = 1
    OpConcurrent  = FALSE
    RacyEdits     = FALSE
    ChildCrash    = FALSE
    Landed        = TRUE
    Mutation      = "finish_after_all_deletes"
    BudgetSeconds = 1800
INVARIANT TypeOK
INVARIANT WithinBudget
PROPERTY NoWedge
