\* NEGATIVE: OI-1003-Q100: no exchange probe at the plan, so on a destination
\* with no atomic exchange a changed seat is staged and its chunks
\* asked of the source before it is refused (the code before the #187
\* review).
\* Mutation late_exchange_refusal must violate ExchangeRefusedUpFront.
\* Rendered from catalogue/Catalogue.dhall; expected outcome in configs.tsv.
SPECIFICATION Spec
CONSTANTS
    Seats               = {a}
    MaxRuns             = 2
    MaxCrashes          = 0
    MaxEdits            = 1
    MaxForeign          = 0
    MaxCommitFails      = 0
    SpaceRefusals       = FALSE
    RelaxedSourceLedger = FALSE
    RelaxedAuthority    = FALSE
    SupersedeMode       = "exchange"
    EstateReads         = FALSE
    MaxBackupSteps      = 2
    Mutation            = "late_exchange_refusal"
    BudgetSeconds       = 300
    StoreRootSealed     = TRUE
    TrackStrictHeld     = FALSE
    AdoptUnrowed        = TRUE
    ExchangeSupported   = FALSE
INVARIANT TypeOK
INVARIANT ExchangeRefusedUpFront
INVARIANT WithinBudget
