\* TIN-6569: the operator edits inside the block (the file becomes
\* theirs: converge refuses MODIFIED, the hand-off never writes it),
\* below it, or removes it by hand, or edits the seat, while an apply
\* or a hand-off is in flight; a crash: the operator's bytes are kept
\* under or without the block (NoLocalWorkLost).
\* Rendered from catalogue/EstateConverge.dhall; expected outcome in configs_ec.tsv.
SPECIFICATION Spec
CONSTANTS
    Items         = {"main"}
    Refs          = {"main"}
    Paths         = {"d"}
    IndexOn       = FALSE
    SrcKinds      = {"seat"}
    OpKinds       = {"block", "seat"}
    MaxSrc        = 1
    MaxOp         = 1
    MaxCrashes    = 1
    OpConcurrent  = TRUE
    RacyEdits     = FALSE
    ChildCrash    = FALSE
    Landed        = TRUE
    Adopt         = FALSE
    Handoff       = TRUE
    Mutation      = "none"
    BudgetSeconds = 1800
INVARIANT TypeOK
INVARIANT NoLocalWorkLost
INVARIANT NoSourceWorkLost
INVARIANT TypedRefusal
INVARIANT NoReRead
INVARIANT CrashAtomicity
INVARIANT OneCheckout
INVARIANT NoDriftedLanding
