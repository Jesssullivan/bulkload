\* NEGATIVE: the destination never answers Reuse AND manifest_capture ignores the
\* source ledger, so a rerun re-reads a committed capture. In code shape
\* (SupersedeMode "off") slo.md's R25 wording fails only when both
\* protections are gone; reread_durable alone never violates it.
\* Mutation reread_ignore_ledger must violate R25_NoCommittedCaptureReread.
\* Rendered from catalogue/Catalogue.dhall; expected outcome in configs.tsv.
SPECIFICATION Spec
CONSTANTS
    Seats               = {a}
    MaxRuns             = 2
    MaxCrashes          = 0
    MaxEdits            = 0
    MaxForeign          = 0
    MaxCommitFails      = 0
    SpaceRefusals       = FALSE
    RelaxedSourceLedger = FALSE
    RelaxedAuthority    = FALSE
    SupersedeMode       = "off"
    EstateReads         = FALSE
    MaxBackupSteps      = 2
    Mutation            = "reread_ignore_ledger"
    BudgetSeconds       = 300
    StoreRootSealed     = TRUE
    TrackStrictHeld     = FALSE
INVARIANT TypeOK
INVARIANT R25_NoCommittedCaptureReread
INVARIANT WithinBudget
