\* Review 3's finding 19, fixed: the source renames foo to foo/bar and
\* switches to it; the operator deletes foo, so the converge plans
\* HEAD onto a new foo/bar; a crash before set_head; the operator puts
\* foo back. The settle's `create foo/bar` can no longer apply, so it
\* re-plans HEAD (detached at the captured head, the branch recorded:
\* head-detached-ref-conflict) instead of refusing on every rerun.
\* Rendered from catalogue/EstateConverge.dhall; expected outcome in configs_ec.tsv.
SPECIFICATION Spec
CONSTANTS
    Items         = {"main"}
    Refs          = {"main", "foo", "foo/bar"}
    Paths         = {}
    IndexOn       = FALSE
    SrcKinds      = {"rename", "switch"}
    OpKinds       = {"ref", "restore"}
    MaxSrc        = 2
    MaxOp         = 2
    MaxCrashes    = 1
    OpConcurrent  = FALSE
    RacyEdits     = FALSE
    ChildCrash    = FALSE
    Landed        = TRUE
    Adopt         = FALSE
    Handoff       = FALSE
    Mutation      = "none"
    BudgetSeconds = 1800
INVARIANT TypeOK
INVARIANT NoLocalWorkLost
INVARIANT NoSourceWorkLost
INVARIANT TypedRefusal
INVARIANT NoReRead
INVARIANT CrashAtomicity
INVARIANT OneCheckout
INVARIANT NoDriftedLanding
INVARIANT AdoptClaimsOnlyEqual
INVARIANT ForeignRefsUnowned
INVARIANT HandoffOwnsOnlyItsBlock
INVARIANT WithinBudget
