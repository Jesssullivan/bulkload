\* NEGATIVE: SourceDone is sent before the ledger's last commit returned.
\* Mutation done_before_sync must violate DoneAfterLedger.
\* Expected outcome: docs/formal/configs.tsv; results: README.md.
SPECIFICATION Spec
CONSTANTS
    Seats               = {a}
    MaxRuns             = 1
    MaxCrashes          = 0
    MaxEdits            = 0
    MaxForeign          = 0
    MaxCommitFails      = 0
    SpaceRefusals       = FALSE
    RelaxedSourceLedger = FALSE
    RelaxedAuthority    = FALSE
    SupersedeMode       = "off"
    EstateReads         = FALSE
    MaxBackupSteps      = 2
    Mutation            = "done_before_sync"
    BudgetSeconds       = 300
INVARIANT DoneAfterLedger
INVARIANT WithinBudget
