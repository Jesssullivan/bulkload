\* NEGATIVE: the same run without fairness may stop short of closure,
\* so RunsClose depends on the fairness assumption.
\* Expected outcome: docs/formal/configs.tsv; results: README.md.
SPECIFICATION Spec
CONSTANTS
    Seats               = {a}
    MaxRuns             = 1
    MaxCrashes          = 0
    MaxEdits            = 0
    MaxForeign          = 0
    MaxCommitFails      = 0
    SpaceRefusals       = FALSE
    RelaxedSourceLedger = FALSE
    RelaxedAuthority    = FALSE
    SupersedeMode       = "off"
    EstateReads         = FALSE
    MaxBackupSteps      = 2
    Mutation            = "none"
    BudgetSeconds       = 300
INVARIANT WithinBudget
PROPERTY RunsClose
