\* OI-1003-Q46's re-root twice in one window, on one item: depth limit
\* 1 and a 4-capture window, so GC can collect the re-root bundle a
\* second re-root abandons; every fault. Explorer preset gc_reroot.
\* MC_gc_reach_second_reroot shows the second re-root is reached.
\* Rendered from catalogue/GitCarry.dhall; expected outcome in configs_gc.tsv.
SPECIFICATION Spec
CONSTANTS
    Items            = {i1}
    DepthLimit       = 1
    RootWindow       = 4
    ChainUnderBase   = FALSE
    GCOn             = TRUE
    MaxCommits       = 4
    MaxRewrites      = 1
    MaxCrashes       = 1
    MaxDamage        = 1
    DamageBase       = FALSE
    DamageRewrites   = TRUE
    BaseMissingTyped = FALSE
    Mutation         = "none"
    BudgetSeconds    = 600
INVARIANT TypeOK
INVARIANT ChainDepthBounded
INVARIANT PrereqsSatisfiedByEarlierLinks
INVARIANT BrokenLinkNeverReuseHit
INVARIANT BaseNotReplacedWhileDepended
INVARIANT GCNeverDeletesDepended
INVARIANT SidecarsBeforeRecord
INVARIANT RestoreOrRecapture
INVARIANT WithinBudget
