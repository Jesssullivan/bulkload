\* NEGATIVE: #187: the exchange runs ahead of the intent's commit, which
\* follows it (begin_supersedes after io::exchange). A crash between
\* the two leaves the new output beside the old output's rows.
\* Mutation exchange_before_intent must violate SupersedeAtomic.
\* Rendered from catalogue/Catalogue.dhall; expected outcome in configs.tsv.
SPECIFICATION Spec
CONSTANTS
    Seats               = {a}
    MaxRuns             = 2
    MaxCrashes          = 1
    MaxEdits            = 1
    MaxForeign          = 0
    MaxCommitFails      = 0
    SpaceRefusals       = FALSE
    RelaxedSourceLedger = FALSE
    RelaxedAuthority    = FALSE
    SupersedeMode       = "exchange"
    EstateReads         = FALSE
    MaxBackupSteps      = 2
    Mutation            = "exchange_before_intent"
    BudgetSeconds       = 300
    StoreRootSealed     = TRUE
    TrackStrictHeld     = FALSE
    AdoptUnrowed        = TRUE
    ExchangeSupported   = TRUE
INVARIANT TypeOK
INVARIANT SupersedeAtomic
INVARIANT WithinBudget
