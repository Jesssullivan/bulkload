\* #226 (review of 2026-10-16, finding 10): the source holds a stash at
\* the copy; the destination's reflog is empty (T1), the operator's
\* (T2) or equal to it (T0, adopted with no write); the source pushes
\* or drops one before or after the adoption; a crash. Liveness with
\* the stated exception AdoptStashKept (a reflog T2 kept, or one a
\* capture carrying none left, stays the destination's, as AdoptKept
\* for refs).
\* Rendered from catalogue/EstateConverge.dhall; expected outcome in configs_ec.tsv.
SPECIFICATION LiveSpec
CONSTANTS
    Items         = {"main"}
    Refs          = {"main"}
    Paths         = {}
    IndexOn       = FALSE
    SrcKinds      = {"stash"}
    OpKinds       = {}
    MaxSrc        = 1
    MaxOp         = 0
    MaxCrashes    = 1
    OpConcurrent  = FALSE
    RacyEdits     = FALSE
    ChildCrash    = FALSE
    Landed        = FALSE
    Adopt         = TRUE
    Mutation      = "none"
    BudgetSeconds = 1800
INVARIANT TypeOK
INVARIANT NoLocalWorkLost
INVARIANT NoSourceWorkLost
INVARIANT TypedRefusal
INVARIANT NoReRead
INVARIANT CrashAtomicity
INVARIANT OneCheckout
INVARIANT NoDriftedLanding
INVARIANT AdoptClaimsOnlyEqual
INVARIANT ForeignRefsUnowned
INVARIANT WithinBudget
PROPERTY ConvergesWhenQuiet
PROPERTY NoWedge
