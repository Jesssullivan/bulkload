\* Liveness under fair captures and applies (SF per item): once the
\* source and the operator stop, with no operator edit left, every
\* item converges (ConvergesWhenQuiet), and no item refuses forever
\* without an operator edit of its own (NoWedge). Refs move, are
\* deleted and renamed (foo -> foo/bar), a seat changes, a touch, a
\* crash.
\* Rendered from catalogue/EstateConverge.dhall; expected outcome in configs_ec.tsv.
SPECIFICATION LiveSpec
CONSTANTS
    Items         = {"main"}
    Refs          = {"main", "foo", "foo/bar", "o/x"}
    Paths         = {"d"}
    IndexOn       = FALSE
    SrcKinds      = {"move", "delete", "rename", "seat"}
    OpKinds       = {"touch"}
    MaxSrc        = 2
    MaxOp         = 1
    MaxCrashes    = 1
    OpConcurrent  = FALSE
    RacyEdits     = FALSE
    ChildCrash    = FALSE
    Landed        = TRUE
    Mutation      = "none"
    BudgetSeconds = 1800
INVARIANT TypeOK
INVARIANT NoLocalWorkLost
INVARIANT NoSourceWorkLost
INVARIANT TypedRefusal
INVARIANT NoReRead
INVARIANT CrashAtomicity
INVARIANT WithinBudget
PROPERTY ConvergesWhenQuiet
PROPERTY NoWedge
