[workspace]
resolver = "2"
members = [
    "crates/bulkload-proto",
    "crates/bulkload-agent",
    "crates/bulkload-bench",
    "crates/bulkload-handoff",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Jess Sullivan"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Jesssullivan/bulkload"
rust-version = "1.93"

# The agent half is held to a deliberately small dependency set; the
# `dep_graph` integration test in bulkload-agent enforces the wall.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
rayon = { version = "1" }
blake3 = { version = "1" }
fastcdc = { version = "3" }
libc = { version = "0.2" }
rusqlite = { version = "0.32", features = ["bundled"] }
crc32c = { version = "0.6" }
clap = { version = "4", features = ["derive", "env"] }
tempfile = { version = "3" }
# Dev-only property testing (plan D3 "Borrow"). No default features: no fork,
# timeout or regex machinery.
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

# The crash harness (bulkload-agent `fault-injection`) and the transfer tests
# chunk and hash 64 MiB+ fixtures many times over; unoptimized CDC and BLAKE3
# dominate their runtime. Optimizing these two leaf crates keeps debug code
# (and its overflow checks) for the workspace while keeping CI time bounded.
[profile.dev.package.fastcdc]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3
