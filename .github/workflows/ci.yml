name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Bazel contract and fixture tests
    runs-on: tinyland-nix
    timeout-minutes: 15
    env:
      # GF #ci exposes its pinned Bazelisk shim under the compatibility name.
      BAZEL_BIN: bazel
      # Pull requests are cache-read-only. Only the trusted main push may
      # publish Bazel action results; tag verification remains read-only.
      GF_BAZEL_REMOTE_UPLOAD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: GloriousFlywheel cache-first validation
        uses: tinyland-inc/GloriousFlywheel/.github/actions/nix-job@ba391f344d71bff4ee902ed8d9928b98546d5f06
        with:
          push-cache: "false"
          command: |
            test -n "${BAZEL_REMOTE_CACHE:-}"
            test "${GF_BAZEL_SUBSTRATE_MODE:-}" = shared-cache-backed
            nix develop github:tinyland-inc/GloriousFlywheel/ba391f344d71bff4ee902ed8d9928b98546d5f06#ci -c just ci
