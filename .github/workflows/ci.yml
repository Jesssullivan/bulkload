name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Bazel contract and fixture tests
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: tinyland-nix
    timeout-minutes: 15
    env:
      ATTIC_TOKEN: ""
      NIX_ACCESS_TOKENS: ""
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact checked out revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Bulkload public-read cache-first validation
        uses: ./.github/actions/bulkload-public-read-ci
        with:
          event-name: ${{ github.event_name }}
          expected-sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ref: ${{ github.ref }}
          repository: ${{ github.repository }}
          head-repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          upload-bazel-results: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
