name: Bulkload public-read CI
description: Run one terminal Bulkload gate through the sanctioned public-read Flywheel front door

inputs:
  gate:
    description: "Exact terminal repository consumer: source, build, test, or fault-harness"
    required: true
  event-name:
    description: Exact triggering event name
    required: true
  expected-sha:
    description: Exact checked-out PR head or push commit
    required: true
  ref:
    description: Exact triggering Git ref
    required: true
  repository:
    description: Exact repository identity
    required: true
  head-repository:
    description: PR head repository, or repository identity for a push
    required: true
  upload-bazel-results:
    description: True only for a trusted push to refs/heads/main
    required: true

runs:
  using: composite
  steps:
    - name: Validate the terminal gate selection
      shell: /bin/bash --noprofile --norc -p {0}
      env:
        BASH_ENV: /dev/null
        ENV: /dev/null
        BULKLOAD_GATE: ${{ inputs.gate }}
      run: |
        set -euo pipefail
        case "$BULKLOAD_GATE" in
          source | build | test | fault-harness) ;;
          *) exit 1 ;;
        esac

    - name: Snapshot the exact public-read guard
      id: guard-snapshot
      shell: /bin/bash --noprofile --norc -p {0}
      env:
        PATH: /nix/var/nix/profiles/default/bin:/usr/bin:/bin:/usr/sbin:/sbin
        HOME: /var/empty
        USER: ""
        USERNAME: ""
        LOGNAME: ""
        BASH_ENV: /dev/null
        ENV: /dev/null
        DYLD_FALLBACK_LIBRARY_PATH: ""
        DYLD_FRAMEWORK_PATH: ""
        DYLD_INSERT_LIBRARIES: ""
        DYLD_LIBRARY_PATH: ""
        NIX_STORE_DIR: ""
        NIX_STORE: ""
        NIX_STATE_DIR: ""
        NIX_DATA_DIR: ""
        NIX_LOG_DIR: ""
        NIX_CONF_DIR: ""
        NIX_DAEMON_SOCKET_PATH: ""
        NIX_IGNORE_SYMLINK_STORE: ""
        NIX_LIBEXEC_DIR: ""
        NIX_BIN_DIR: ""
        NIX_REMOTE_SYSTEMS: ""
        NIX_SSL_CERT_FILE: ""
        NIX_CURL_FLAGS: ""
        NIX_HASHED_MIRRORS: ""
        JAVA_TOOL_OPTIONS: ""
        JDK_JAVA_OPTIONS: ""
        _JAVA_OPTIONS: ""
        JAVA_HOME: ""
        JAVACMD: ""
        BAZEL_SH: ""
        BAZELISK_NOJDK: ""
        BAZELISK_CLEAN: ""
        BAZELISK_SHUTDOWN: ""
        USE_BAZEL_FALLBACK_VERSION: ""
        TEST_TMPDIR: ""
        NIX_CACHE_HOME: ""
        NIX_CONFIG_HOME: ""
        NIX_DATA_HOME: ""
        NIX_STATE_HOME: ""
        XDG_CACHE_HOME: ""
        XDG_CONFIG_HOME: ""
        XDG_DATA_HOME: ""
        XDG_STATE_HOME: ""
        ATTIC_TOKEN: ""
        NIX_ACCESS_TOKENS: ""
        NIX_USER_CONF_FILES: /dev/null
        NETRC: /dev/null
        NIX_CONFIG: |-
          substituters = https://cache.nixos.org/
          store = local
          allow-symlinked-store = false
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
          trusted-substituters =
          builders =
          builders-use-substitutes = false
          build-hook =
          pre-build-hook =
          post-build-hook =
          diff-hook =
          run-diff-hook = false
          require-sigs = true
          access-tokens =
          netrc-file = /dev/null
          accept-flake-config = false
          secret-key-files =
          plugin-files =
        NIX_REMOTE: local
        BAZELISK_BASE_URL: ""
        BAZELISK_FORMAT_URL: ""
        BAZELISK_GITHUB_TOKEN: ""
        BAZELISK_HOME: ""
        BAZELISK_HOME_DARWIN: ""
        BAZELISK_HOME_LINUX: ""
        BAZELISK_INCOMPATIBLE_FLAGS: ""
        BAZELISK_VERIFY_SHA256: ""
        BAZELISK_SKIP_WRAPPER: "true"
        BAZELISK_WRAPPER_DIRECTORY: ""
        USE_BAZEL_VERSION: ""
      run: |
        set -euo pipefail
        expected=ba46969b7826d64d9493d38b865e264cb78c47d2269f0f66e08a171f8acd9535
        source_guard="$GITHUB_WORKSPACE/scripts/ci-public-read-guard.sh"
        [[ "$(/usr/bin/sha256sum "$source_guard" | /usr/bin/awk '{print $1}')" == "$expected" ]]
        guard_dir=$(/usr/bin/mktemp -d "$RUNNER_TEMP/bulkload-public-read-guard.XXXXXXXX")
        /bin/chmod 0700 "$guard_dir"
        guard="$guard_dir/ci-public-read-guard.sh"
        /usr/bin/install -m 0500 "$source_guard" "$guard"
        [[ "$(/usr/bin/sha256sum "$guard" | /usr/bin/awk '{print $1}')" == "$expected" ]]
        runtime_home="$guard_dir/runtime-home"
        source_runtime_home="$guard_dir/source-runtime-home"
        /bin/mkdir -m 0700 "$runtime_home" "$source_runtime_home"
        printf 'guard_path=%s\n' "$guard" >> "$GITHUB_OUTPUT"
        printf 'runtime_home=%s\n' "$runtime_home" >> "$GITHUB_OUTPUT"
        printf 'source_runtime_home=%s\n' "$source_runtime_home" >> "$GITHUB_OUTPUT"

    - name: Preflight raw runner endpoint authority
      shell: /bin/bash --noprofile --norc -p {0}
      env:
        PATH: /nix/var/nix/profiles/default/bin:/usr/bin:/bin:/usr/sbin:/sbin
        HOME: ${{ steps.guard-snapshot.outputs.runtime_home }}
        USER: ""
        USERNAME: ""
        LOGNAME: ""
        BASH_ENV: /dev/null
        ENV: /dev/null
        DYLD_FALLBACK_LIBRARY_PATH: ""
        DYLD_FRAMEWORK_PATH: ""
        DYLD_INSERT_LIBRARIES: ""
        DYLD_LIBRARY_PATH: ""
        NIX_STORE_DIR: ""
        NIX_STORE: ""
        NIX_STATE_DIR: ""
        NIX_DATA_DIR: ""
        NIX_LOG_DIR: ""
        NIX_CONF_DIR: ""
        NIX_DAEMON_SOCKET_PATH: ""
        NIX_IGNORE_SYMLINK_STORE: ""
        NIX_LIBEXEC_DIR: ""
        NIX_BIN_DIR: ""
        NIX_REMOTE_SYSTEMS: ""
        NIX_SSL_CERT_FILE: ""
        NIX_CURL_FLAGS: ""
        NIX_HASHED_MIRRORS: ""
        JAVA_TOOL_OPTIONS: ""
        JDK_JAVA_OPTIONS: ""
        _JAVA_OPTIONS: ""
        JAVA_HOME: ""
        JAVACMD: ""
        BAZEL_SH: ""
        BAZELISK_NOJDK: ""
        BAZELISK_CLEAN: ""
        BAZELISK_SHUTDOWN: ""
        USE_BAZEL_FALLBACK_VERSION: ""
        TEST_TMPDIR: ""
        NIX_CACHE_HOME: ${{ steps.guard-snapshot.outputs.runtime_home }}
        NIX_CONFIG_HOME: ${{ steps.guard-snapshot.outputs.runtime_home }}
        NIX_DATA_HOME: ${{ steps.guard-snapshot.outputs.runtime_home }}
        NIX_STATE_HOME: ${{ steps.guard-snapshot.outputs.runtime_home }}
        XDG_CACHE_HOME: ${{ steps.guard-snapshot.outputs.runtime_home }}
        XDG_CONFIG_HOME: ${{ steps.guard-snapshot.outputs.runtime_home }}
        XDG_DATA_HOME: ${{ steps.guard-snapshot.outputs.runtime_home }}
        XDG_STATE_HOME: ${{ steps.guard-snapshot.outputs.runtime_home }}
        ATTIC_TOKEN: ""
        NIX_ACCESS_TOKENS: ""
        NIX_USER_CONF_FILES: /dev/null
        NETRC: /dev/null
        NIX_CONFIG: |-
          substituters = https://cache.nixos.org/
          store = local
          allow-symlinked-store = false
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
          trusted-substituters =
          builders =
          builders-use-substitutes = false
          build-hook =
          pre-build-hook =
          post-build-hook =
          diff-hook =
          run-diff-hook = false
          require-sigs = true
          access-tokens =
          netrc-file = /dev/null
          accept-flake-config = false
          secret-key-files =
          plugin-files =
        NIX_REMOTE: local
        BAZELISK_BASE_URL: ""
        BAZELISK_FORMAT_URL: ""
        BAZELISK_GITHUB_TOKEN: ""
        BAZELISK_HOME: ""
        BAZELISK_HOME_DARWIN: ""
        BAZELISK_HOME_LINUX: ""
        BAZELISK_INCOMPATIBLE_FLAGS: ""
        BAZELISK_VERIFY_SHA256: ""
        BAZELISK_SKIP_WRAPPER: "true"
        BAZELISK_WRAPPER_DIRECTORY: ""
        USE_BAZEL_VERSION: ""
        BULKLOAD_GUARD_PATH: ${{ steps.guard-snapshot.outputs.guard_path }}
        BULKLOAD_RUNTIME_HOME: ${{ steps.guard-snapshot.outputs.runtime_home }}
        BULKLOAD_EVENT_NAME: ${{ inputs.event-name }}
        BULKLOAD_EXPECTED_SHA: ${{ inputs.expected-sha }}
        BULKLOAD_REF: ${{ inputs.ref }}
        BULKLOAD_REPOSITORY: ${{ inputs.repository }}
        BULKLOAD_HEAD_REPOSITORY: ${{ inputs.head-repository }}
        BULKLOAD_UPLOAD_BAZEL_RESULTS: ${{ inputs.upload-bazel-results }}
        BULKLOAD_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        BULKLOAD_RUNNER_NAME: ${{ runner.name }}
      run: |
        set -euo pipefail
        guard_source=$(/bin/cat -- "$BULKLOAD_GUARD_PATH"; printf x)
        guard_source=${guard_source%x}
        [[ "$(printf '%s' "$guard_source" | /usr/bin/sha256sum | /usr/bin/awk '{print $1}')" == ba46969b7826d64d9493d38b865e264cb78c47d2269f0f66e08a171f8acd9535 ]]
        printf '%s' "$guard_source" | /bin/bash --noprofile --norc -p -s -- preflight

    - name: Discover sanctioned runner endpoint authority
      id: endpoints
      uses: tinyland-inc/ci-templates/.github/actions/nix-setup@139bd4c7deabbe07c918dc764a3b9f054066431d # v2.13.0
      env:
        PATH: /nix/var/nix/profiles/default/bin:/usr/bin:/bin:/usr/sbin:/sbin
        HOME: ${{ steps.guard-snapshot.outputs.runtime_home }}
        USER: ""
        USERNAME: ""
        LOGNAME: ""
        BASH_ENV: /dev/null
        ENV: /dev/null
        DYLD_FALLBACK_LIBRARY_PATH: ""
        DYLD_FRAMEWORK_PATH: ""
        DYLD_INSERT_LIBRARIES: ""
        DYLD_LIBRARY_PATH: ""
        NIX_STORE_DIR: ""
        NIX_STORE: ""
        NIX_STATE_DIR: ""
        NIX_DATA_DIR: ""
        NIX_LOG_DIR: ""
        NIX_CONF_DIR: ""
