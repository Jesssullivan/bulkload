        NIX_HASHED_MIRRORS: ""
        JAVA_TOOL_OPTIONS: ""
        JDK_JAVA_OPTIONS: ""
        _JAVA_OPTIONS: ""
        JAVA_HOME: ""
        JAVACMD: ""
        BAZEL_SH: ""
        BAZELISK_NOJDK: ""
        BAZELISK_CLEAN: ""
        BAZELISK_SHUTDOWN: ""
        USE_BAZEL_FALLBACK_VERSION: ""
